<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:56px 22px 72px}
main{width:100%;max-width:520px;text-align:center}
.divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 auto 14px;max-width:300px}
.divider i{flex:1;height:1px;background:#111}
.divider img{height:26px;width:auto;display:block}
.script{width:min(340px,80%);height:auto;display:block;margin:0 auto 44px}
p.msg{font-size:18px;line-height:1.55;margin:0 0 28px}
form{text-align:left}
label{display:block;font-size:13px;letter-spacing:.04em;margin:0 0 6px}
label span{color:#666;font-weight:400}
input,textarea{width:100%;font:inherit;font-size:16px;color:#111;background:#fff;border:1px solid #111;border-radius:0;padding:11px 12px;margin:0 0 18px}
textarea{min-height:150px;resize:vertical}
input:focus,textarea:focus{outline:2px solid #111;outline-offset:2px}
.count{font-size:12px;color:#666;text-align:right;margin:-12px 0 18px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
button{font:inherit;font-size:15px;letter-spacing:.06em;background:#111;color:#fff;border:1px solid #111;padding:13px 30px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#status{margin-top:18px;font-size:15px;min-height:1.4em}
</style>

  <p class="msg">Things are changing. If you want to get in touch, send me a message:</p>
  <form id="f" novalidate>
    <label for="name">Name</label>
    <input id="name" name="name" type="text" autocomplete="name" required maxlength="120">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required maxlength="200">
    <label for="phone">Phone <span>(optional)</span></label>
    <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="40">
    <label for="message">Message</label>
    <textarea id="message" name="message" required maxlength="2000"></textarea>
    <div class="count"><span id="n">0</span> / 2000</div>
    <div class="hp" aria-hidden="true"><label>Leave empty<input name="website" tabindex="-1" autocomplete="off"></label></div>
    <button id="b" type="submit">Send</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>
</main>
<script>
var ENDPOINT="https://script.google.com/macros/s/AKfycbz0kdNiZzbYeiN09fQDz8NzkW92P1rdeDT3Oq8_Q7HZwmhD1d8fqKlO_0aR0ItxrnBCwQ/exec";
var f=document.getElementById('f'),m=document.getElementById('message'),n=document.getElementById('n'),s=document.getElementById('status'),b=document.getElementById('b');
m.addEventListener('input',function(){n.textContent=m.value.length});
f.addEventListener('submit',function(e){
  e.preventDefault();
  if(!f.name.value.trim()||!/^\S+@\S+\.\S+$/.test(f.email.value.trim())||!m.value.trim()){s.textContent='Please add your name, a valid email, and a message.';return}
  if(f.website.value){return}
  b.disabled=true;s.textContent='Sending…';
  var body=new URLSearchParams({name:f.name.value.trim(),email:f.email.value.trim(),phone:f.phone.value.trim(),message:m.value.trim()});
  fetch(ENDPOINT,{method:'POST',body:body}).then(function(r){return r.json()}).then(function(j){
    if(j&&j.ok){f.reset();n.textContent='0';s.textContent='Thank you — your message was sent.'}
    else{throw new Error('fail')}
  }).catch(function(){s.textContent='Something went wrong. Please try again in a bit.'}).then(function(){b.disabled=false});
});
</script>
